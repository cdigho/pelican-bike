<html lang="zh-CN">

<style>
  :root{
    --mango:#FFD23F; --coral:#E4653F; --lagoon:#2EC4B6; --deep:#1A535C;
    --shell:#FFF6E8; --dusk:#6E5A8E; --mint:#06D6A0; --red:#E63946; --orange:#FF9E4F;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#1A535C;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--shell)}
  #app{position:fixed;inset:0}
  canvas{display:block}
  /* ---------- UI 总层 ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .4s}
  #ui.hidden{opacity:0}
  .panel{pointer-events:auto;background:rgba(20,52,58,.58);backdrop-filter:blur(8px);
    border:1px solid rgba(255,246,232,.22);border-radius:14px;box-shadow:0 6px 24px rgba(6,20,26,.35)}
  /* ---------- 左下码表 ---------- */
  #hud{position:absolute;left:16px;bottom:16px;width:132px;height:132px}
  #hud svg{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  /* ---------- 顶部日落滑杆 ---------- */
  #topBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;padding:9px 16px;min-width:300px}
  #topBar .lbl{font-size:12px;letter-spacing:2px;white-space:nowrap;color:var(--mango)}
  #tod{-webkit-appearance:none;appearance:none;width:180px;height:6px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#FFF6E8 0%,#FFD23F 22%,#FF9E4F 42%,#E4653F 55%,#6E5A8E 75%,#1A535C 100%);pointer-events:auto}
  #tod::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--shell);border:3px solid var(--coral);cursor:pointer;box-shadow:0 0 8px rgba(255,158,79,.8)}
  /* ---------- 底部控制条 ---------- */
  #ctrl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;padding:8px 10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw}
  .btn{pointer-events:auto;border:1px solid rgba(255,246,232,.28);background:rgba(255,246,232,.08);
    color:var(--shell);border-radius:10px;padding:7px 13px;font-size:13px;cursor:pointer;
    font-family:inherit;letter-spacing:1px;transition:all .15s;white-space:nowrap}
  .btn:hover{background:rgba(255,210,63,.22);border-color:var(--mango)}
  .btn:active{transform:scale(.94)}
  .btn.on{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:bold}
  .btn.gear.on{background:var(--orange);border-color:var(--orange)}
  .btn small{display:block;font-size:9px;opacity:.65;letter-spacing:0}
  .sep{width:1px;height:26px;background:rgba(255,246,232,.2);margin:0 2px}
  /* ---------- 右上设置 ---------- */
  #gearPanel{position:absolute;top:12px;right:12px;width:196px;padding:10px 12px;font-size:12px}
  #gearPanel h4{font-size:12px;letter-spacing:2px;color:var(--mango);margin-bottom:8px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center}
  #gearBody{display:flex;flex-direction:column;gap:8px}
  #gearPanel.closed #gearBody{display:none}
  #gearPanel label{display:flex;justify-content:space-between;align-items:center;gap:6px;color:rgba(255,246,232,.9)}
  #gearPanel select{pointer-events:auto;background:rgba(6,20,26,.8);color:var(--shell);border:1px solid rgba(255,246,232,.3);
    border-radius:6px;padding:2px 6px;font-family:inherit;font-size:12px}
  #gearPanel input[type=checkbox]{pointer-events:auto;width:16px;height:16px;accent-color:var(--coral);cursor:pointer}
  /* ---------- 右下性能面板 ---------- */
  #perf{position:absolute;right:12px;bottom:16px;padding:8px 12px;font-size:11px;line-height:1.7;
    color:rgba(255,246,232,.85);font-variant-numeric:tabular-nums;min-width:132px}
  #perf b{color:var(--mint);font-weight:600}
  /* ---------- toast ---------- */
  #toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);
    padding:10px 22px;border-radius:24px;background:rgba(230,57,70,.92);color:#fff;font-size:14px;
    letter-spacing:1px;opacity:0;transition:all .35s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---------- 新手引导 ---------- */
  #guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 30px;
    text-align:center;max-width:min(480px,90vw);transition:opacity .8s}
  #guide h2{font-size:22px;color:var(--mango);letter-spacing:4px;margin-bottom:4px}
  #guide .sub{font-size:12px;opacity:.75;margin-bottom:14px;letter-spacing:2px}
  #guide ul{list-style:none;font-size:13px;line-height:2;text-align:left;display:inline-block}
  #guide kbd{background:rgba(255,210,63,.16);border:1px solid rgba(255,210,63,.5);border-radius:5px;
    padding:1px 7px;font-family:inherit;color:var(--mango);margin-right:8px;font-size:12px}
  #guide.gone{opacity:0;pointer-events:none}
  /* ---------- 兜日时刻电影黑边(letterbox,嫁接自 B) ---------- */
  .lb{position:absolute;left:0;width:100%;height:0;background:#0b1e22;z-index:9;pointer-events:none;
    transition:height .9s cubic-bezier(.6,0,.3,1);box-shadow:0 0 26px rgba(6,20,26,.65)}
  #lbTop{top:0} #lbBot{bottom:0}
  body.cine .lb{height:56px}
  /* ---------- 降级提示 ---------- */
  #fallback{position:fixed;inset:0;display:none;place-items:center;background:linear-gradient(#1A535C,#0d2730);z-index:99;text-align:center;padding:24px}
  #fallback .box{max-width:420px;padding:30px;border:1px solid rgba(255,246,232,.25);border-radius:16px}
  #fallback h2{color:var(--mango);margin-bottom:12px;letter-spacing:2px}
  #fallback p{font-size:14px;line-height:1.8;opacity:.85}
  /* ---------- 手机竖屏 ---------- */
  @media (max-aspect-ratio: 3/4){
    body.cine .lb{height:40px}
    #hud{width:96px;height:96px;left:10px;bottom:86px}
    #topBar{min-width:0;padding:7px 10px}
    #tod{width:110px}
    #ctrl{bottom:10px;gap:5px;padding:6px}
    .btn{padding:6px 9px;font-size:12px}
    .btn small{display:none}
    #perf{display:none}
    #gearPanel{width:160px}
  }
</style>

<script>
/* ---- CDN/模块加载失败兜底:type=module 脚本若因 CDN 故障未执行,__PB_OK__ 永不置位 ---- */
(function(){
  function showFallback(html, title){
    var f=document.getElementById('fallback'); if(!f) return;
    var m=document.getElementById('fbMsg');
    if(m) m.innerHTML=html;
    var h=f.querySelector('h2'); if(h && title) h.textContent=title;   // 软提示与定死报错用不同标题
    f.style.display='grid';
  }
  window.__pbShowFallback=showFallback;
  // 引擎就绪后撤掉兜底遮罩(慢网下 8s 提示层弹出、随后模块加载成功时靠它恢复画面)
  window.__pbHideFallback=function(){
    var f=document.getElementById('fallback');
    if(f) f.style.display='none';
  };
  window.addEventListener('error',function(e){
    if(window.__PB_OK__) return;
    var t=e&&e.target;
    if(t&&(t.tagName==='SCRIPT'||t.tagName==='LINK')){
      showFallback('3D 引擎脚本加载失败:可能是网络不佳或 CDN 暂时不可达。<br>请检查网络连接后刷新重试。','无法启动 3D 场景');
    }
  },true);
  var waited=0, softShown=false;
  var timer=setInterval(function(){
    if(window.__PB_OK__){ clearInterval(timer); window.__pbHideFallback(); return; }
    if(window.__PB_FAIL__){ clearInterval(timer); return; }   // WebGL 构造失败已给出精确提示,轮询不再覆盖
    waited+=0.5;
    if(waited>=12){
      clearInterval(timer);
      showFallback('3D 场景启动超时:可能是网络不佳导致引擎加载失败。<br>请检查网络连接后刷新重试。','无法启动 3D 场景');
    } else if(waited>=8 && !softShown){
      // 8s 先给非定论提示;12s 仍无 __PB_OK__ 才判死,避免慢网误杀
      softShown=true;
      showFallback('3D 引擎仍在加载中(网络可能较慢)…<br>加载完成后会自动进入场景,请稍候或刷新重试。','3D 场景加载中');
    }
  },500);
})();
</script>

<script type="module">
/* =====================================================================================
   落日湾 · 大喉囊骑士 —— 鹈鹕骑自行车 单文件 3D 互动页面
   分区:0常量与工具 / 1场景初始化 / 2海天 / 3道路环境 / 4自行车 / 5鹈鹕 / 6粒子
        7生物 / 8昼夜管理 / 9音频 / 10UI / 11交互与彩蛋 / 12相机 / 13主循环
   ===================================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ===== 0. 常量与工具 ================================================================ */
const PAL = {
  sunsetOrange: 0xFF9E4F, mango: 0xFFD23F, coral: 0xE4653F, lagoon: 0x2EC4B6,
  deepTeal: 0x1A535C, shell: 0xFFF6E8, duskPurple: 0x6E5A8E, mint: 0x06D6A0, signalRed: 0xE63946
};
const CFG = {
  wheelR: 0.34, wheelBase: 1.06, gearRatio: 2.5, crankR: 0.165,
  gears: [ {name:'漫步', v:2.2}, {name:'巡航', v:4.6}, {name:'飞驰', v:8.2} ],
  paraNear: 1.0, paraMid: 0.45, paraFar: 0.15,
  poolLen: 96, midLen: 110, roadHalfW: 1.7,
  camPos0: new THREE.Vector3(-3.4, 1.5, -0.9), camTgt0: new THREE.Vector3(0.15, 1.02, 0.05)
};
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const damp = (cur,tgt,l,dt)=>lerp(cur,tgt,1-Math.exp(-l*dt));
const rand = (a,b)=>a+Math.random()*(b-a);
const smooth = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const easeIO = t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const shade = (hex,f)=>new THREE.Color(hex).multiplyScalar(f);
const TAU = Math.PI*2;
const $ = id=>document.getElementById(id);
// 临时向量池(避免每帧分配)
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _v3=new THREE.Vector3(), _v4=new THREE.Vector3();
const _UP = new THREE.Vector3(0,1,0);
// 简易值噪声(悬挂颠簸/风场用)
const vnoise = t => Math.sin(t*1.7)*0.6 + Math.sin(t*2.9+1.3)*0.4;
// canvas 程序化贴图
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// 径向光晕贴图
function glowTex(inner,outer){
  return canvasTex(128,128,(g)=>{ const gr=g.createRadialGradient(64,64,2,64,64,64);
    gr.addColorStop(0,inner); gr.addColorStop(1,outer); g.fillStyle=gr; g.fillRect(0,0,128,128); });
}
// 两点之间摆放圆柱/长条(骨骼式对齐)
function placeBetween(mesh,a,b){
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  _v1.subVectors(b,a); const len=_v1.length();
  if(mesh.userData.baseLen) mesh.scale.y = len/mesh.userData.baseLen;
  mesh.quaternion.setFromUnitVectors(_UP,_v1.normalize());
}
// 材质工厂(全局复用)
function mat(color,opt={}){ return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,metalness:0},opt)); }

/* ===== 1. 场景初始化 ================================================================ */
let renderer, scene, camera, controls;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch(e){
  window.__PB_FAIL__=true;
  $('fallback').style.display='grid';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);

scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xE4653F, 38, 185);
camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
camera.position.copy(CFG.camPos0);
controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CFG.camTgt0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 2.4; controls.maxDistance = 18;
controls.minPolarAngle = Math.PI/6;       // 俯仰上限 60°
const MAX_POLAR = 85*Math.PI/180;         // 俯仰下限 5° 防穿地(兜日/撒把演出期间临时放宽,见 updateCamera)
controls.maxPolarAngle = MAX_POLAR;
controls.maxTargetRadius = 6;

/* ---- 三点光系统:暖橙主光 + 暮蓝半球光 + 冷色逆光 ---- */
const sunLight = new THREE.DirectionalLight(0xFF9E4F, 2.4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048,2048);
sunLight.shadow.camera.left=-8; sunLight.shadow.camera.right=8;
sunLight.shadow.camera.top=8; sunLight.shadow.camera.bottom=-8;
sunLight.shadow.camera.near=0.5; sunLight.shadow.camera.far=80;
sunLight.shadow.bias = -0.0006; sunLight.shadow.radius = 4;
scene.add(sunLight); scene.add(sunLight.target);
const hemiLight = new THREE.HemisphereLight(0x6E5A8E, 0xE4653F, 0.85);
scene.add(hemiLight);
const rimLight = new THREE.DirectionalLight(0x9fd8e8, 1.1);   // 冷色逆光勾金边
rimLight.position.set(-14, 6, -10);
scene.add(rimLight);
const cineLight = new THREE.PointLight(0xFFD23F, 0, 18, 2);   // 兜日时刻囊内金光
scene.add(cineLight);

/* ===== 2. 海与天 ==================================================================== */
/* ---- 渐变天空穹顶(着色器) ---- */
const skyU = {
  uTop:{value:new THREE.Color(PAL.duskPurple)}, uMid:{value:new THREE.Color(PAL.sunsetOrange)},
  uHor:{value:new THREE.Color(PAL.mango)}, uSunDir:{value:new THREE.Vector3(1,0.2,0)},
  uSunCol:{value:new THREE.Color(PAL.sunsetOrange)}, uSunI:{value:1}, uNeon:{value:0}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(400, 32, 20),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
    vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 uTop,uMid,uHor,uSunCol; uniform vec3 uSunDir; uniform float uSunI,uNeon;
      varying vec3 vDir;
      void main(){
        vec3 d=normalize(vDir); float h=d.y;
        vec3 col=mix(uHor,uMid,smoothstep(-0.02,0.16,h));
        col=mix(col,uTop,smoothstep(0.12,0.62,h));
        col=mix(col,uHor*0.72,smoothstep(0.0,-0.12,h));      // 地平线下压暗
        float s=max(dot(d,normalize(uSunDir)),0.0);
        col+=uSunCol*(pow(s,14.0)*0.20+pow(s,120.0)*0.32+pow(s,600.0)*0.5)*uSunI;
        vec3 neon=mix(vec3(0.024,0.114,0.135), uHor*0.0, 0.0);  // 夜骑深青墨底
        col=mix(col, vec3(0.035,0.13,0.16)+uTop*0.25*smoothstep(0.3,1.0,h), uNeon);

const seaU = {
  uT:{value:0}, uAmp:{value:1}, uDeep:{value:shade(PAL.deepTeal,.8)}, uShallow:{value:new THREE.Color(PAL.lagoon)},
  uSpec:{value:new THREE.Color(PAL.mango)}, uSpecI:{value:1}, uSunDir:{value:new THREE.Vector3(1,.2,0)},
  uFogColor:{value:new THREE.Color(PAL.coral)}, uFogNear:{value:38}, uFogFar:{value:185}
};
const seaMat = new THREE.ShaderMaterial({
  uniforms:seaU,
  vertexShader:`
    uniform float uT,uAmp; varying vec3 vW; varying float vH;
    float wv(vec2 p,float t){
      return sin(p.x*0.31+t*1.05)*0.5 + sin(p.y*0.23-t*0.8+p.x*0.12)*0.35 + sin((p.x+p.y)*0.5+t*1.7)*0.15;
    }
    void main(){
      vec4 wp=modelMatrix*vec4(position,1.0);
      float nearShore=1.0+smoothstep(30.0,8.0,wp.x)*0.9;   // 近岸波幅更大
      float w=wv(wp.xz,uT)*0.16*uAmp*nearShore;
      wp.y+=w; vH=w; vW=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader:`
    uniform float uT,uSpecI,uFogNear,uFogFar; uniform vec3 uDeep,uShallow,uSpec,uSunDir,uFogColor;
    varying vec3 vW; varying float vH;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      // 解析导数重建法线(与顶点波形 wv(wp.xz,uT) 同一坐标系:平面坐标是 x/z,原 vW.y 是波浪高度属笔误)
      float t=uT;
      float dx = cos(vW.x*0.31+t*1.05)*0.5*0.31 + cos(vW.z*0.23-t*0.8+vW.x*0.12)*0.35*0.12 + cos((vW.x+vW.z)*0.5+t*1.7)*0.15*0.5;
      float dz = cos(vW.z*0.23-t*0.8+vW.x*0.12)*0.35*0.23 + cos((vW.x+vW.z)*0.5+t*1.7)*0.15*0.5;
      vec3 n=normalize(vec3(-dx,1.0,-dz));
      vec3 V=normalize(cameraPosition-vW);
      vec3 L=normalize(uSunDir);
      vec3 Hv=normalize(L+V);
      float spec=pow(max(dot(n,Hv),0.0),90.0);
      float glit=step(0.78,hash(floor(vW.xz*2.6)+floor(t*5.0)));   // 波光闪烁
      vec3 col=mix(uShallow,uDeep,smoothstep(8.0,-90.0,vW.x-6.0));
      col=mix(col,col*1.25+vec3(0.02),smoothstep(-0.06,0.1,vH));    // 波峰微亮
      col+=uSpec*spec*uSpecI*(0.35+0.65*glit)*1.15;
      float d=distance(cameraPosition,vW);
      col=mix(col,uFogColor,smoothstep(uFogNear,uFogFar,d));
      gl_FragColor=vec4(col,1.0);
    }`
});

  const shoulder=new THREE.Group(); shoulder.position.set(side*0.27,0.20,0.03);

  sh.moveTo(0,0); sh.quadraticCurveTo(0.28*side,0.17,0.56*side,0.04);
  sh.quadraticCurveTo(0.36*side,-0.06,0.16*side,-0.10); sh.closePath();
  const inner=new THREE.Mesh(new THREE.ShapeGeometry(sh,6), new THREE.MeshStandardMaterial({color:PAL.shell,side:THREE.DoubleSide,roughness:.8}));
  const tipSh=new THREE.Shape();
  tipSh.moveTo(0.30*side,-0.045); tipSh.quadraticCurveTo(0.46*side,0.09,0.56*side,0.04);
  tipSh.quadraticCurveTo(0.44*side,-0.045,0.30*side,-0.045); tipSh.closePath();
  const tip=new THREE.Mesh(new THREE.ShapeGeometry(tipSh,4), new THREE.MeshStandardMaterial({color:PAL.deepTeal,side:THREE.DoubleSide,roughness:.85}));
  tip.position.z=0.004;
  const g=new THREE.Group(); g.add(inner,tip); shoulder.add(g);
  shoulder.userData={wing:g, side};
  return shoulder;
}

const dustU={ uT:{value:0}, uDensity:{value:0.45}, uColor:{value:new THREE.Color(PAL.mango)}, uAlpha:{value:1} };
{
  const N=150, pos=new Float32Array(N*3), seed=new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]=rand(-7,9); pos[i*3+1]=rand(0.2,5.5); pos[i*3+2]=rand(-16,9); seed[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  const m=new THREE.ShaderMaterial({
    uniforms:dustU, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      attribute float aSeed; uniform float uT,uDensity; varying float vA;
      void main(){
        vec3 p=position;
        p.y=mod(p.y + uT*(0.18+aSeed*0.3), 5.8)+0.2;
        p.x+=sin(uT*0.5+aSeed*21.0)*0.7;
        p.z+=cos(uT*0.4+aSeed*17.0)*0.5;
        vec4 mv=viewMatrix*vec4(p,1.0);
        float tw=0.5+0.5*sin(uT*(1.5+aSeed*3.5)+aSeed*40.0);
        vA=tw*step(aSeed,uDensity)*smoothstep(0.7,2.4,-mv.z);   // 过近粒子淡出,避免超大点精灵
        gl_PointSize=min((2.2+aSeed*3.4)*(115.0/max(1.0,-mv.z)), 44.0);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform vec3 uColor; uniform float uAlpha; varying float vA;
      void main(){
        float d=length(gl_PointCoord-0.5);
        float a=smoothstep(0.5,0.06,d)*vA*uAlpha;
        gl_FragColor=vec4(uColor*a*1.7, a);
      }`
  });
  scene.add(new THREE.Points(g,m));
}
const petalU={ uT:{value:0}, uSpeed:{value:1}, uDensity:{value:0.5} };
{
  const N=42, pos=new Float32Array(N*3), seed=new Float32Array(N);
  for(let i=0;i<N;i++){ pos[i*3]=rand(-9,7); pos[i*3+1]=rand(0.4,4.5); pos[i*3+2]=rand(-24,10); seed[i]=Math.random(); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  const m=new THREE.ShaderMaterial({
    uniforms:petalU, transparent:true, depthWrite:false,
    vertexShader:`
      attribute float aSeed; uniform float uT,uSpeed,uDensity; varying float vA; varying float vFlip;
      void main(){
        vec3 p=position;
        float travel=uT*uSpeed*(1.1+aSeed*1.6);
        p.z=mod(p.z+travel+30.0, 36.0)-26.0;
        p.x+=sin(uT*1.3+aSeed*30.0)*1.1+sin(uT*0.5+aSeed*50.0)*0.5;
        p.y+=sin(uT*1.8+aSeed*40.0)*0.4;
        vec4 mv=viewMatrix*vec4(p,1.0);
        vA=step(aSeed,uDensity)*(0.5+0.5*sin(uT*3.0+aSeed*20.0))*smoothstep(0.7,2.4,-mv.z);
        vFlip=sin(uT*4.0+aSeed*6.28);                 // 翻转闪烁按粒子相位(原 sin(uT+gl_FragCoord.x) 逐像素振荡会画成竖条纹梳)
        gl_PointSize=min((2.6+aSeed*2.6)*(150.0/max(1.0,-mv.z)), 48.0);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform float uT; varying float vA; varying float vFlip;
      void main(){
        float d=length(gl_PointCoord-0.5);
        vec2 c=gl_PointCoord-0.5; c.x*=abs(vFlip);    // 简易翻转闪烁(逐粒子)
        float a=smoothstep(0.5,0.1,length(c))*vA;
        gl_FragColor=vec4(vec3(1.0,0.965,0.91), a*0.9);
      }`
  });
  scene.add(new THREE.Points(g,m));
}

/* ===== 8. 昼夜时间轴管理器(单一输出源,全画面联动) ================================= */
const TOD = {
  t: 0.455,                       // 0 正午 → 0.5 日落 → 1 暮蓝(默认停在黄金时刻)
  nightRide: false, nightF: 0,    // 霓虹夜骑混合系数
  cineSun: 0,                     // 兜日时太阳"被兜住"程度 0..1
  flip: 0,                        // 兜日时刻主光方位 180° 翻转(长投影转向镜头,嫁接自 B)
  _c1:new THREE.Color(), _c2:new THREE.Color(),
  mix3(a,b,f){ return this._c1.set(a).lerp(this._c2.set(b), f); },
  apply(){
    const t=this.t;
    const elev = Math.cos(t*Math.PI) * (62*Math.PI/180);        // 太阳高度角
    const h = Math.sin(elev);
    const goldF = clamp(1-Math.abs(h-0.22)/0.30, 0, 1);          // 黄金时刻权重
    const nightF0 = clamp(-h*5, 0, 1);                           // 落日后的夜色
    const nf = Math.max(nightF0, this.nightF);                   // 夜骑强制入夜
    const sunAz = -0.18;                                         // 太阳方位(+X 偏 -Z)
    const dir=_v1.set(Math.cos(elev)*Math.cos(sunAz), Math.max(Math.sin(elev),0.12), Math.cos(elev)*Math.sin(sunAz)).normalize();
    // 太阳视觉位置(穹顶内侧)
    sunGroup.position.copy(dir).multiplyScalar(210);
    sunGroup.position.y = Math.max(sunGroup.position.y, -3);
    sunGroup.lookAt(camera.position);
    sunGroup.visible = this.cineSun<0.9 && nf<0.7;
    sunDisc.material.opacity = (1-nf)*(1-this.cineSun);
    ring1.material.opacity = 0.4*(1-nf)*(1-this.cineSun);
    ring2.material.opacity = 0.2*(1-nf)*(1-this.cineSun);
    sunHalo.position.copy(sunGroup.position); sunHalo.material.opacity=(0.55+goldF*0.35)*(1-nf)*(1-this.cineSun);
    skyU.uSunDir.value.copy(dir); skyU.uSunI.value = (0.25+clamp(h*2.2,0,1))*(1-nf)+nf*0.0;
    // 平行光:色温与强度
    const sunCol = this.mix3(PAL.shell, PAL.sunsetOrange, goldF).lerp(this._c2.set(PAL.coral), clamp((0.12-h)*4,0,1)*(1-nf));
    sunLight.color.copy(nf>0? this.mix3(sunCol.getHex(), PAL.duskPurple, nf) : sunCol);
    sunLight.intensity = lerp(lerp(2.7, 2.3, goldF), 0.5, nf) * (1 - this.flip*0.55);   // 兜日时主光压暗让位囊内金光(同 B 的 sigLightDim)
    sunLight.position.copy(dir).multiplyScalar(26);
    sunLight.position.y = Math.max(sunLight.position.y, 26*Math.sin(7*Math.PI/180));  // 影长钳制≥8°
    if(this.flip>0.001) sunLight.position.applyAxisAngle(_UP, this.flip*Math.PI);     // 方位 180° 翻转:光切到 +X 正面,长投影逆着机位拉远(仅平行光,天空视觉太阳不翻)
    // 半球天光
    hemiLight.color.copy(this.mix3(shade(PAL.duskPurple,1.5).getHex(), PAL.duskPurple, goldF).lerp(this._c2.set(PAL.deepTeal), nf));
    hemiLight.groundColor.copy(this.mix3(shade(PAL.coral,.7).getHex(), shade(PAL.coral,.5).getHex(), goldF).lerp(this._c2.set(shade(PAL.deepTeal,.4)), nf));
    hemiLight.intensity = lerp(0.95, 0.4, nf);
    rimLight.intensity = lerp(1.15, 0.5, nf) + this.cineSun*0.8;
    // 雾(fogEnabled 关闭时保留实例、把 near/far 推到视野外等效无雾;置 null 会让本函数下一帧崩溃)
    const fogC = this.mix3(shade(PAL.coral,1.15).getHex(), shade(PAL.coral,.85).getHex(), clamp((0.2-h)*3,0,1)).lerp(this._c2.set(shade(PAL.deepTeal,.35)), nf);
    scene.fog.color.copy(fogC);
    if(fogEnabled){
      scene.fog.near = lerp(lerp(42, 34, goldF), 22, nf);
      scene.fog.far  = lerp(lerp(200, 170, goldF), 120, nf);
    } else {
      scene.fog.near = 1000; scene.fog.far = 1200;   // 相机 far=600,场景内所有可见物 d<600 → 雾因子恒 0
    }
    // 天空三段渐变
    skyU.uTop.value.copy(this.mix3(shade(PAL.duskPurple,1.45).getHex(), PAL.duskPurple, goldF).lerp(this._c2.set(shade(PAL.deepTeal,.5)), nf));
    skyU.uMid.value.copy(this.mix3(PAL.sunsetOrange, PAL.sunsetOrange, goldF).lerp(this._c2.set(PAL.deepTeal), nf));
    skyU.uHor.value.copy(this.mix3(PAL.mango, PAL.coral, clamp((0.16-h)*3.2,0,1)).lerp(this._c2.set(PAL.deepTeal), nf));
    skyU.uNeon.value = this.nightF;
    // 海面
    seaU.uSunDir.value.copy(dir);
    seaU.uDeep.value.copy(this.mix3(shade(PAL.deepTeal,.85).getHex(), shade(PAL.deepTeal,.4), nf));
    seaU.uShallow.value.copy(this.mix3(PAL.lagoon, shade(PAL.lagoon,.35), nf));
    seaU.uSpec.value.copy(this.mix3(PAL.mango, shade(PAL.duskPurple,1.3), nf));
    seaU.uSpecI.value = (0.4+goldF*0.8)*(1-nf)+nf*0.25;
    seaU.uFogColor.value.copy(fogC); seaU.uFogNear.value=scene.fog.near; seaU.uFogFar.value=scene.fog.far;
    // 灯塔与路灯
    lighthouse.userData.lamp.material.color.copy(this.mix3(PAL.mango, 0xfff2b0, nf));
    for(const h2 of lampHeads){ h2.material.color.copy(this.mix3(shade(PAL.mango,.9).getHex(), 0xffe9a8, nf)); }
    curbMat.opacity = this.nightF*0.9;
    neonMat.opacity = this.nightF;
    beam.material.opacity = this.nightF*0.07 + goldF*0.02;
    // 浮尘
    dustU.uAlpha.value = (0.35+goldF*0.65)*(1-nf);
    // 贝壳白环境亮度 → 尾灯夜间更醒目(刹车/换挡闪烁期间不覆盖,否则 44Hz 闪烁被本行死写)
    if(!S.braking && S.brakeFlash<=0) tailLampMat.emissiveIntensity = 0.8 + nf*1.2;
  }
};

/* ===== 9. 音频(Web Audio 全合成,默认静音) ======================================== */
const Snd = {
  ctx:null, master:null, on:false, waves:null, wind:null,
  ensure(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=0; this.master.connect(this.ctx.destination);
    // 海浪:白噪 + 低通 + LFO
    const len=this.ctx.sampleRate*2, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
    const g=this.ctx.createGain(); g.gain.value=0.16;
    const lfo=this.ctx.createOscillator(); lfo.frequency.value=0.13;
    const lfoG=this.ctx.createGain(); lfoG.gain.value=0.08;
    lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start();
    src.connect(lp); lp.connect(g); g.connect(this.master); src.start();
    // 风:白噪 + 带通
    const src2=this.ctx.createBufferSource(); src2.buffer=buf; src2.loop=true;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=0.6;
    const g2=this.ctx.createGain(); g2.gain.value=0.0;
    src2.connect(bp); bp.connect(g2); g2.connect(this.master); src2.start();
    this.wind=g2;
  },
  toggle(){
    this.ensure(); if(!this.ctx) return false;
    this.on=!this.on;
    if(this.ctx.state==='suspended') this.ctx.resume();
    this.master.gain.linearRampToValueAtTime(this.on?0.9:0, this.ctx.currentTime+0.25);
    return this.on;
  },
  blip(freq, dur, type='sine', vol=0.5, slide=0){
    if(!this.on||!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), this.ctx.currentTime+dur);
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+dur);
    o.connect(g); g.connect(this.master); o.start(); o.stop(this.ctx.currentTime+dur+0.05);
  },
  bell(){ this.blip(2093,0.5,'sine',0.5); this.blip(2637,0.35,'sine',0.3); },
  gurgle(){ this.blip(120,0.28,'sawtooth',0.35,-55); setTimeout(()=>this.blip(95,0.2,'sawtooth',0.25,-40),120); },
  shutter(){ this.blip(1800,0.05,'square',0.2); setTimeout(()=>this.blip(900,0.06,'square',0.15),60); },
  magic(){ this.blip(520,0.6,'triangle',0.3,600); },
  setWind(v){ if(this.wind) this.wind.gain.value = this.on? v*0.12 : 0; }
};

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
let downXY=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downXY=[e.clientX,e.clientY]; dismissGuide(); });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY) return;
  const dx=e.clientX-downXY[0], dy=e.clientY-downXY[1]; downXY=null;
  if(dx*dx+dy*dy>36) return;                      // 拖拽不算点击
  pointer.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(pointer, camera);
  // 点车铃
  if(raycaster.intersectObject(bell.group,true).length){ ringBell(); return; }

  if(sunGroup.visible && raycaster.intersectObjects([sunDisc,ring1,ring2],false).length){
    const now=performance.now();
    if(now-S.sunClickT>1600) S.sunClicks=0;
    S.sunClickT=now; S.sunClicks++;
    if(S.sunClicks>=3){
      S.sunClicks=0; S.nightBlendTarget=S.nightBlendTarget?0:1;
      toast(S.nightBlendTarget?'暮色霓虹夜骑!再点太阳三次切回落日':'欢迎回到落日湾');

function startCine(manual){
  if(S.swoop>0) return;                           // 撒把滑翔期间禁止兜日,防止相机/时标互踩
  if(S.cine||S.cineCd>0&&!manual) return;
  if(S.cine) return;
  dismissGuide();
  S.cine={ t:0, phase:0 }; S.timeScale=1; S.eyeWide=1;
  cineLight.intensity=0;
  document.body.classList.add('cine');            // letterbox 电影黑边(嫁接自 B)
  flyTo(new THREE.Vector3(3.9,0.9,-3.4), new THREE.Vector3(0.4,1.5,-0.3), 1.2);
  toast('♪ 喉囊兜日 —— 把落日装进口袋 ♪',3000);
}
function updateCine(rdt){
  const c=S.cine; if(!c) return;
  c.t+=rdt;
  const T=c.t;
  if(c.phase===0 && T>1.1){ c.phase=1; S.timeScale=0.4; Snd.magic(); }
  if(c.phase===1){
    // 车身缓缓转向太阳,展翅张囊
    const k=smooth(1.1,2.6,T);
    bikeRig.rotation.y = lerp(0,-1.75,k);          // 车头转向 +X(太阳方向)
    const w=smooth(1.3,2.3,T);
    wingL.rotation.z=lerp(wingL.rotation.z,-1.35,0.1); wingR.rotation.z=lerp(wingR.rotation.z,1.35,0.1);
    wingL.rotation.y=wingR.rotation.y=lerp(wingL.rotation.y,0,0.1);
    headGrp.rotation.x=lerp(headGrp.rotation.x,0.55,0.08);
    S.pouchScale=lerp(S.pouchScale||1,2.1,0.06);
    pouchGlowMat.opacity=w*0.55; pouchSkinMat.opacity=lerp(0.86,0.42,w);
    cineLight.intensity=w*55;                      // 囊内金光 55 强度(同 B 规格,金光爆发感)
    renderer.toneMappingExposure=1.02+w*0.24;      // 曝光随点光同步拔高(1.02→1.26,峰值保留躯干层次)
    TOD.flip=smooth(1.8,3.4,T);                    // 主光方位 180° 翻转推进(长投影特写)
    if(T>2.2 && !c.ball){                          // 太阳被兜进囊里
      c.ball=true; TOD.cineSun=1; cineLight.getWorldPosition(_v1);
      sunBall.position.copy(sunGroup.position).multiplyScalar(0.42);
      sunBall.material.opacity=1;
      // 入囊瞬间切正面低机位:主光已翻到 +X,长投影逆着机位拉远(嫁接自 B 的镜头语言)
      flyTo(new THREE.Vector3(2.9,0.62,-1.9), new THREE.Vector3(0.35,1.15,-0.15), 1.4);
    }
    if(c.ball){
      pouchTip.getWorldPosition(_v2);
      sunBall.position.lerp(_v2, 0.09);
    }
    if(T>5.6){ c.phase=2; }
  }
  if(c.phase===2){
    // 仰头把落日"倒"回天际
    const k=smooth(5.6,7.4,T);
    headGrp.rotation.x=lerp(0.55,0.95,k);
    pouchTip.getWorldPosition(_v2);
    if(k<1){ sunBall.position.lerpVectors(_v2, _v1.copy(sunGroup.position).multiplyScalar(0.42).setY(sunGroup.position.y), k); }
    pouchGlowMat.opacity=lerp(0.55,0,(k));
    cineLight.intensity=55*(1-k);
    renderer.toneMappingExposure=1.02+0.24*(1-k);
    TOD.flip=1-k;                                  // 主光方位随光效回收同步翻回
    if(k>=1){ c.phase=3; TOD.cineSun=0; sunBall.material.opacity=0; Snd.magic(); }
  }
  if(c.phase===3){
    const k=smooth(7.4,9.0,T);
    bikeRig.rotation.y=lerp(-1.75,0,k);
    S.pouchScale=lerp(2.1,1,k);
    pouchSkinMat.opacity=0.86;
    wingL.rotation.z=lerp(-1.35,-0.42,k); wingR.rotation.z=lerp(1.35,0.42,k);
    headGrp.rotation.x=lerp(0.95,0,k);
    if(T>9.0){
      S.cine=null; S.cineCd=9; S.timeScale=1; S.eyeWide=0; renderer.toneMappingExposure=1.02;
      TOD.flip=0; cineLight.intensity=0;
      document.body.classList.remove('cine');      // 收起 letterbox
      // 就近里程碑:按当前档速把里程碑摆到冷却结束瞬间恰好滑入触发窗的位置(巡航 9s≈18.6m),
      // 替换原 40s 长等——冷却归零后很快自然触发下一次兜日
      milestone.position.z = clamp(-(S.cineCd*CFG.gears[S.gear].v*CFG.paraMid - 1.5), -42, -8);
      flyTo(CFG.camPos0.clone(), CFG.camTgt0.clone(), 1.0);
      toast('落日归位,继续骑行~',1800);
    }
  }
}

let cardBusy=false;
function postcard(){
  if(cardBusy||S.cine) return;
  cardBusy=true;
  const prevExp=renderer.toneMappingExposure;
  S.paused=true; $('ui').classList.add('hidden');
  renderer.toneMappingExposure=prevExp+0.32;
  renderer.render(scene,camera);
  Snd.shutter();
  // 合成明信片:白框 + 邮戳 + 时间戳
  const src=renderer.domElement;
  const W=1440, H=810, BD=46;
  const out=document.createElement('canvas'); out.width=W; out.height=H;
  const g=out.getContext('2d');
  g.fillStyle='#FFF6E8'; g.fillRect(0,0,W,H);
  g.drawImage(src,0,0,src.width,src.height, BD,BD, W-BD*2, H-BD*2);
  g.strokeStyle='rgba(26,83,92,.55)'; g.lineWidth=2; g.strokeRect(BD+8,BD+8,W-BD*2-16,H-BD*2-16);
  // 邮戳
  g.save(); g.translate(W-190,170); g.rotate(-0.21);
  g.strokeStyle='#E4653F'; g.lineWidth=4; g.beginPath(); g.arc(0,0,64,0,TAU); g.stroke();
  g.beginPath(); g.arc(0,0,52,0,TAU); g.stroke();
  g.fillStyle='#E4653F'; g.textAlign='center';
  g.font='bold 24px "PingFang SC",sans-serif'; g.fillText('落日湾邮政',0,-8);
  g.font='bold 17px sans-serif'; g.fillText('SUNSET BAY POST',0,18);
  g.font='16px sans-serif'; g.fillText(new Date().toLocaleDateString('zh-CN'),0,40);
  g.restore();
  g.fillStyle='#1A535C'; g.font='22px "PingFang SC",sans-serif'; g.textAlign='center';
  g.fillText(`落日湾 · 大喉囊骑士  ${new Date().toLocaleString('zh-CN')}`, W/2, H-16);
  const a=document.createElement('a');
  a.download=`落日湾_大喉囊骑士_${Date.now()}.png`; a.href=out.toDataURL('image/png'); a.click();
  toast('明信片已生成并开始下载',2000);
  setTimeout(()=>{
    renderer.toneMappingExposure=prevExp;
    S.paused=false; $('ui').classList.remove('hidden'); cardBusy=false;
  }, 900);
}

/* ===== 12. 相机系统(速度 FOV / 微震 / 缓动飞行) =================================== */
let camFly=null;
function flyTo(pos,tgt,dur){
  camFly={ t:0, dur, p0:camera.position.clone(), p1:pos, t0:controls.target.clone(), t1:tgt };
  controls.enabled=false;
}
function updateCamera(dt){
  // 飞行/兜日/撒把期间放宽极角上限:兜日机位极角 97°、撒把 88°,超 85° 限制,
  // 若不放宽,飞行落地首个 controls.update() 会把相机竖直钳跳回锥内(实测弹跳 1.01m)。
  // 放宽持续到回到默认机位(其极角 82.6° 合法)才恢复,恢复瞬间无跳变。
  controls.maxPolarAngle = (camFly || S.cine || S.swoop>0)? Math.PI : MAX_POLAR;
  if(camFly){
    camFly.t+=dt;
    const k=easeIO(clamp(camFly.t/camFly.dur,0,1));
    camera.position.lerpVectors(camFly.p0,camFly.p1,k);
    controls.target.lerpVectors(camFly.t0,camFly.t1,k);
    camera.lookAt(controls.target);   // 飞行期间朝向同步看向目标(controls.enabled=false 时 update 不做 lookAt,原实现镜头平移保持旧朝向,主角出画)
    if(camFly.t>=camFly.dur){ camFly=null; controls.enabled=true; }
  } else controls.update();
  // 速度 FOV(竖屏窄视口按 aspect 补偿基础 FOV,避免水平视角收窄把主体裁出画面)
  const sn=clamp((S.v-2)/6.2,0,1);
  const baseF=55*(camera.aspect<0.98? Math.min(1.45, Math.max(1, 0.9/camera.aspect)) : 1);
  const tf=baseF+17*sn + (S.swoop>0?-4:0);
  if(Math.abs(camera.fov-tf)>0.05){ camera.fov=damp(camera.fov,tf,3,dt); camera.updateProjectionMatrix(); }
}
/* ---- 渲染前叠加镜头微震 ---- */
function applyShake(){
  const sn=clamp((S.v-2)/6.2,0,1);
  const a=(sn*0.028 + S.bump*0.10)*(S.cine?0.2:1);
  _v1.set(vnoise(Sim.t*7.3)*a, vnoise(Sim.t*8.7+40)*a, 0);
  camera.position.add(_v1);
  return _v1;
}

/* ===== 13. 主循环(统一时钟驱动) =================================================== */
const Sim={ t:0, real:0 };
const clock=new THREE.Clock();
let fpsAcc=0, fpsN=0, fpsLowCount=0, degradeStep=0;
const Perf={ fps:0 };

function solveIK(key, pedalWorld){
  // 髋-膝-踝两段式 IK(余弦定理),膝朝车头方向
  const leg=legs[key];
  _v2.copy(pedalWorld); bodyGrp.worldToLocal(_v2);          // 踏板→躯干局部
  const hip=leg.hip;
  _v3.subVectors(_v2,hip); let d=_v3.length();
  const maxL=(L1+L2)*0.999;
  if(d>maxL){ _v3.multiplyScalar(maxL/d); d=maxL; _v2.copy(hip).add(_v3); }
  const a=(L1*L1-L2*L2+d*d)/(2*d);
  const hh=Math.sqrt(Math.max(L1*L1-a*a,0.0001));
  _v3.normalize();                                           // hip→pedal 单位向量
  const kd=_v4.set(0,0.12,-1).normalize();                   // 膝盖前置方向
  kd.addScaledVector(_v3,-kd.dot(_v3)).normalize();          // 去掉沿腿分量 → 垂直
  const knee=new THREE.Vector3().copy(hip).addScaledVector(_v3,a).addScaledVector(kd,hh);
  placeBetween(leg.thigh, hip, knee);
  const ankle=_v2; // 踝=踏板(局部)
  placeBetween(leg.shin, knee, ankle);
  leg.foot.position.copy(pedalWorld);
  bike.worldToLocal(leg.foot.position);   // 世界→bike 局部(bike 每帧有悬挂 y 偏移与侧倾,foot 是 bike 子对象,需与 thigh/shin 同样的层级处理)
  leg.foot.position.y+=0.028;
}

function tick(){
  requestAnimationFrame(tick);
  const rdt=Math.min(clock.getDelta(),0.05);
  Sim.real+=rdt;
  if(S.paused){ renderer.render(scene,camera); return; }
  updateCine(rdt);
  // 夜骑混合
  TOD.nightF=damp(TOD.nightF,S.nightBlendTarget,1.6,rdt);
  // 速度缓动(0.5s 档位过渡)
  S.v=damp(S.v, S.braking? Math.max(0.6,S.targetV*0.25) : S.targetV, 6, rdt);
  const dt=rdt*S.timeScale;
  Sim.t+=dt;
  const t=Sim.t;
  S.odo+=S.v*dt;
  Snd.setWind(clamp((S.v-2)/6.2,0,1));

  /* ---- 传动与轮地线速度一致 ---- */
  const wWheel=S.v/CFG.wheelR;
  S.wheelAng-=wWheel*dt;                    // 前进 -Z → 绕 x 负向
  const wCrank=wWheel/CFG.gearRatio*(S.express>0?0.55:1);   // 大喉囊快递满载:踏频减速 45%(原 expressSlow 死变量从未接入)
  S.crankAng-=wCrank*dt;                    // 与车轮同向(绕 x 负向),原 + 号让鹈鹕"倒踩"踏板
  const crankPhase=S.crankAng;
  wheelRear.userData.spin.rotation.z=S.wheelAng;
  wheelFront.userData.spin.rotation.z=S.wheelAng;
  crank.rotation.x=crankPhase;
  // 踏板位置(公转不自转,保持水平)
  for(const [key,ph,sx] of [['L',crankPhase,-1],['R',crankPhase+Math.PI,1]]){
    const px=sx*0.115, py=BB.y+Math.cos(ph)*CFG.crankR, pz=BB.z+Math.sin(ph)*CFG.crankR;
    pedals[key].position.set(px,py,pz);
    solveIK(key, pedals[key].getWorldPosition(_v1));
  }
  // 链条 dashOffset = 链轮节线线速度
  const chainV=wCrank*0.135*dt/0.055;
  chainMatUp.map.offset.y+=chainV; chainMatLow.map.offset.y-=chainV;   // 曲柄反向后链条行进方向同步对调

  /* ---- 档位/刹车显示 ---- */
  S.brakeFlash=Math.max(0,S.brakeFlash-dt*2);
  tailLampMat.emissiveIntensity = (S.braking||S.brakeFlash>0)?
    (Math.sin(Sim.real*44)>0?4.2:0.3) : 0.9+TOD.nightF*1.2;

  /* ---- 骑行动画:起伏/摇车/悬挂/转向 ---- */
  const sn=clamp((S.v-2)/6.2,0,1);
  const bobAmp=lerp(0.02,0.06,sn)*(S.swoop>0?0.4:1);
  S.bob=Math.sin(crankPhase*2)*bobAmp;
  S.rocking=Math.sin(crankPhase)*3*Math.PI/180*(0.5+sn*0.7)*(S.swoop>0?0.3:1);
  // 悬挂:噪声 + 接缝微弹
  S.seamAcc+=S.v*dt/8;
  if(Math.floor(S.seamAcc)!==S.seamCount){ S.seamCount=Math.floor(S.seamAcc); S.bumpV+=0.055; }
  S.bumpV+=(-S.bump*60-S.bumpV*8)*dt;
  S.bump+=S.bumpV*dt;
  bodyGrp.position.y=1.06+S.bob;
  bodyGrp.rotation.z=S.rocking*0.7;
  pelican.rotation.z=S.rocking*0.4;
  bike.position.y=vnoise(t*2.2)*0.012+S.bump*0.5;
  bike.rotation.z=-S.rocking*0.5;
  wheelFront.position.y=-0.54+vnoise(t*2.2+2.1)*0.008;   // 前后轮相位错开 0.25 周期
  // 转向:自平衡蛇形 + 鼠标操控,阻尼耦合侧倾
  const steerT=S.mouse.x*20*Math.PI/180 + Math.sin(t*0.7)*2*Math.PI/180;
  S.steer=damp(S.steer, steerT, 4, rdt);
  handlebar.rotation.y=S.steer*0.6;
  if(!S.cine) bikeRig.rotation.y=Math.sin(t*0.45)*1.5*Math.PI/180;   // cine 期间交给 updateCine 写转向(原每帧覆盖成 0)
  const leanT=clamp(-S.steer*0.85,-18*Math.PI/180,18*Math.PI/180)*(S.cine?0:1);
  S.lean=damp(S.lean, leanT, 3.2, rdt);
  bikeRig.rotation.z=S.lean+S.rocking*0.25;
  tailGrp.rotation.x=-S.lean*1.6 - S.bob*2.2 - (S.swoop>0?0.35:0);
  tailGrp.rotation.y=Math.sin(crankPhase)*0.18*sn;
  // 头颈弹簧稳定(临界阻尼延迟跟随,视线保持水平)
  const hv=-S.bump*2.5-S.bob*3;
  headGrp.rotation.x=damp(headGrp.rotation.x, (S.cine||S.swoop>0)?headGrp.rotation.x:0+hv*0.12, 6, rdt);
  headGrp.rotation.z=damp(headGrp.rotation.z, S.lean*0.55 + S.steer*0.35, 7, rdt);   // 预判侧倾
  headGrp.rotation.y=damp(headGrp.rotation.y, S.mouse.x*0.22 + (S.bellAnim>0.2?0.55:0), 4, rdt);
  // 颈部 S 形柔性缓冲
  const n1=new THREE.Vector3(0,0.36,-0.14);
  const n2=new THREE.Vector3(0,0.62,-0.36);
  n2.x+=Math.sin(Sim.real*2.1)*0.02; n2.z-=S.bob*0.8;
  const hp=headGrp.position;
  placeBetween(neck1, n1, n2);
  placeBetween(neck2, n2, hp);
  // 眨眼 / 瞳孔 / 眼神
  S.blinkT-=rdt;
  if(S.blinkT<=0){ S.blinkAnim=0.16; S.blinkT=rand(0.8,6); }
  if(S.blinkAnim>0){ S.blinkAnim-=rdt; }
  const eyelid=(S.blinkAnim>0? Math.abs(Math.sin(S.blinkAnim/0.16*Math.PI))>0.5?0.12:1 : 1);
  for(const e of eyeBalls){
    const target=S.eyeWide>0?1.35:1;
    e.scale.x=damp(e.scale.x,target,10,rdt); e.scale.y=damp(e.scale.y,eyelid*(S.eyeWide>0?1.3:1),10,rdt);
    e.userData.pupil.position.x=damp(e.userData.pupil.position.x, -0.016 + S.mouse.x*0.012, 8, rdt);
    e.userData.pupil.position.y=damp(e.userData.pupil.position.y, 0.004 + S.mouse.y*0.008, 8, rdt);
  }
  // 咕噜口型
  if(S.jawTalk>0){ S.jawTalk-=rdt; jawGrp.rotation.x=Math.abs(Math.sin(S.jawTalk*14))*0.3*(S.jawTalk); }
  else jawGrp.rotation.x=damp(jawGrp.rotation.x,0,8,rdt);
  // 喉囊双态:呼吸 / 风灌 / 风帆
  const breathe=1+Math.sin(t*Math.PI*1.0)*0.04;
  let pTarget=breathe*(1+sn*0.35);
  if(S.swoop>0) pTarget=1.75;
  if(S.express>0) pTarget=2.25;
  if(S.cine) pTarget=S.pouchScale||1.6;
  S.pouchScale=damp(S.pouchScale||1, pTarget, 4, rdt);
  pouch.scale.set(S.pouchScale, S.pouchScale*0.92, S.pouchScale*1.35*(1+sn*0.25));
  pouchGlow.scale.copy(pouch.scale);
  // 按铃动画
  if(S.bellAnim>0){ S.bellAnim-=rdt*1.4; bell.dome.rotation.x=Math.sin(S.bellAnim*25)*0.4*S.bellAnim; }
  else bell.dome.rotation.x=0;
  // 围巾随风
  scarfSegs.forEach((seg,i)=>{
    seg.rotation.y=Math.sin(t*(6+sn*4)-i*0.9)*(0.35+sn*0.5);
    seg.rotation.x=Math.sin(t*(7+sn*5)-i*1.3)*0.2+0.1+sn*0.3;
  });
  // 翅膀:骑行收拢搭把(微张可见翼形) ↔ 撒把/兜日展开扇动
  const spread=(S.swoop>0||S.cine)?1:0;
  for(const w of [wingL,wingR]){
    const s=w.userData.side;
    w.rotation.z=damp(w.rotation.z, -s*lerp(0.32,-1.35,spread)+(spread?Math.sin(t*8)*0.2:0), 3, rdt);
    w.rotation.y=damp(w.rotation.y, s*lerp(0.32,0,spread), 3, rdt);
    w.rotation.x=damp(w.rotation.x, s*lerp(0.55,0,spread), 3, rdt);
  }
  // 高速辐条模糊盘:飞驰档辐条淡出、半透明盘接管(B 规格 opacity≈0.35,λ=6 ≈ 0.5s 缓动)
  // 消除高频采样下 16 根辐条的放射状走样,同时强化速度感
  const blurK=smooth(0.55,0.9,sn);
  S.spokeFade=damp(S.spokeFade||0, blurK, 6, rdt);
  spokeMat.opacity=1-S.spokeFade*0.8;              // 辐条淡到 0.2,保留一点结构感
  wheelRear.userData.blur.material.opacity=S.spokeFade*0.35;
  wheelFront.userData.blur.material.opacity=S.spokeFade*0.35;
  // 撒把倒计时
  if(S.swoop>0){
    S.swoop-=rdt;
    if(S.swoop<=0){
      S.swoop=0; S.timeScale=1; S.flare=0; controls.enabled=true;
      flyTo(CFG.camPos0.clone(), CFG.camTgt0.clone(), 0.8);
      toast('稳稳接回车把!',1500);
    }
  }
  // 大喉囊快递
  if(S.express>0){
    S.express-=dt;
    bodyGrp.rotation.x=Math.sin(t*3)*0.06;         // 满载摇摆
    if(S.express<=0){ S.express=0; bodyGrp.rotation.x=0; toast('快递送达!喉囊卸货',1600); }
  }
  // 贝雷帽吹飞计时(飞驰档骑行中)
  if(S.beret && S.gear===2 && !S.beretFlown && !S.cine && S.v>6){
    S.beretTimer+=dt;
    if(S.beretTimer>4) blowBeret();
  }
  // 贝雷帽抛物线飞行
  if(beretAnim.active){
    beretAnim.t+=dt/1.4;
    if(beretAnim.t>=1){
      beretAnim.active=false; beretFly.visible=false; beretAnim.landed=true;
      beretOnSign.position.copy(beretAnim.to); beretOnSign.visible=true;
    } else {
      _v1.lerpVectors(beretAnim.from, beretAnim.to, beretAnim.t);
      _v1.y += 1.8*4*beretAnim.t*(1-beretAnim.t);
      beretFly.position.copy(_v1);
      beretFly.rotation.x+=dt*7; beretFly.rotation.z+=dt*4;
    }
  }
  // 兜日冷却
  if(S.cineCd>0) S.cineCd-=rdt;

  /* ---- 喂鱼抛物线 ---- */
  for(const f of fishPool){
    if(!f.active) continue;
    f.t+=dt/1.15;
    if(f.t>=1){
      f.active=false; f.obj.visible=false;
      S.fishCount++; S.jawTalk=0.8; S.eyeWide=1; setTimeout(()=>S.eyeWide=0,700);
      Snd.gurgle();
      toast(`接住!喉囊 +1(第 ${S.fishCount} 条)`,1300);
      if(S.fishCount===7){ S.express=8; toast('★ 大喉囊快递:满载启运,减速慢行 ★',3200); }
      continue;
    }
    _v1.lerpVectors(f.from,f.to,f.t);
    _v1.y+=f.h*4*f.t*(1-f.t);
    f.obj.position.copy(_v1);
    f.obj.rotation.z+=dt*6;
  }

  /* ---- 世界滚动:三层视差严格同源 ---- */
  const scrollNear=S.v*dt*CFG.paraNear, scrollMid=S.v*dt*CFG.paraMid, scrollFar=S.v*dt*CFG.paraFar;
  roadTex.offset.y+=scrollNear/200*22;   // + 号与虚线/接缝同向(+Z):实测 offset 增加时纹理特征向 +Z 移动(原 - 号反向滚动)
  for(const it of nearPool){
    it.obj.position.z+=scrollNear;
    if(it.obj.position.z>18){ it.obj.position.z-=it.span; it.respawn(it.obj); }
  }
  for(const it of midPool){
    it.obj.position.z+=scrollMid;
    if(it.obj.position.z>24){ it.obj.position.z-=it.span; it.respawn(it.obj); }
  }
  lighthouse.position.z+=scrollFar;
  if(lighthouse.position.z>90) lighthouse.position.z-=320;
  // 挂在路牌上的贝雷帽随中景循环,出界即回收
  if(beretAnim.landed && beretOnSign.visible){
    beretOnSign.position.z+=scrollMid;
    if(beretOnSign.position.z>24) beretOnSign.visible=false;
  }
  // 里程碑兜日触发
  milestone.position.z+=scrollMid;
  if(milestone.position.z>24) milestone.position.z-=CFG.midLen;
  if(milestone.position.z>-2 && milestone.position.z<2 && !S.cine && S.cineCd<=0 && TOD.cineSun===0) startCine(false);
  // 云漂移
  for(const c of clouds){
    c.position.x+=c.userData.spd*dt;
    if(c.position.x>110) c.position.x=-110;
  }
  // 灯塔/路灯夜态
  for(const it of midPool){ if(it.obj.userData.pool) it.obj.userData.pool.material.opacity=TOD.nightF*0.85; }
  // 路灯 glow:每灯独立材质按相机距离封顶衰减(过近淡出),杜绝大 sprite 软采样竖条纹伪影
  for(const lg of lampGlows){
    lg.s.getWorldPosition(_v2);
    lg.m.opacity = TOD.nightF * 0.85 * smooth(2.2, 4.5, _v2.distanceTo(camera.position));
  }

  /* ---- 海天昼夜 ---- */
  seaU.uT.value=t;
  windUniform.value=t;
  dustU.uT.value=t; petalU.uT.value=t;
  petalU.uSpeed.value=0.4+sn*2.6;
  TOD.apply();
  // 兜日光晕增强
  sunHalo.material.color.setHex(PAL.mango);
  sunHalo.material.rotation+=rdt*0.05;
  const flareK=(S.flare>0?0.5:0)+TOD.cineSun*0.5;
  sunHalo.scale.setScalar(44+flareK*55);

  /* ---- 环境生命体 ---- */
  for(const g of gulls){
    const u=g.userData;
    u.scared=Math.max(0,u.scared-dt);
    const a=t*0.25*u.r+u.phase;
    _v1.set(20+Math.cos(a)*17*u.r, 11+Math.sin(a*2)*1.2+u.i*0.8, -16+Math.sin(a)*24*u.r);   // 轨道外推抬高,避开默认机位视锥
    if(u.scared>0){
      _v1.lerp(u.scatter, smooth(3,0,u.scared)*0.8+0.2);
      g.position.lerp(_v1, 0.06);
    } else g.position.lerp(_v1, 0.04);
    g.rotation.y=Math.atan2(_v1.x-g.position.x, _v1.z-g.position.z)*-1;
    const fl=Math.sin(t*u.flap+u.phase)*0.6;
    g.children[1].rotation.x=fl; g.children[2].rotation.x=-fl;
  }
  for(const b of butterflies){
    const u=b.userData, a=t*u.sp+u.phase;
    b.position.set(0.8+Math.sin(a)*1.3, 1.35+Math.sin(a*2)*0.35, -1.6+Math.cos(a)*0.9);
    b.rotation.y=a+Math.PI/2;
    const fl=0.4+Math.abs(Math.sin(t*22+u.phase))*0.9;
    u.wl.rotation.y=fl; u.wr.rotation.y=-fl;
  }
  // 镜头光晕 ghost(沿屏幕中心对称)
  _v1.copy(sunGroup.position).project(camera);
  const gx=_v1.x, gy=_v1.y;
  ghosts.forEach((gh,i)=>{
    const k=[0.4,-0.3,0.75][i];
    gh.position.set(gx*k, gy*k, 0.5).unproject(camera);
    const o=(0.06+flareK*0.2)*(1-TOD.nightF);
    gh.material.opacity=o;
    gh.visible = o>0.075;   // 常态 ghost 0.06 在软光栅下呈方块伪影,仅滑翔/兜日演出增强时显示
  });

  /* ---- 相机与渲染 ---- */
  updateCamera(rdt);
  const shake=applyShake();
  renderer.render(scene,camera);
  camera.position.sub(shake);

  /* ---- 性能监控与自动降级 ---- */
  fpsAcc+=rdt; fpsN++;
  if(fpsAcc>=0.5){
    Perf.fps=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0;
    $('pFps').textContent=Perf.fps;
    $('pCalls').textContent=renderer.info.render.calls;
    $('pTris').textContent=(renderer.info.render.triangles/1000).toFixed(0)+'k';
    const auto=$('setAuto').checked;
    if(Perf.fps<45 && auto){
      fpsLowCount++;
      if(fpsLowCount>=6 && degradeStep===0){ degradeStep=1; dustU.uDensity.value*=0.5; petalU.uDensity.value*=0.5; toast('已自动优化画质:粒子减半'); }
      else if(fpsLowCount>=12 && degradeStep===1){ degradeStep=2; renderer.shadowMap.enabled=false; sunLight.castShadow=false; toast('已自动优化画质:关闭阴影'); }
    } else if(Perf.fps>=55) fpsLowCount=0;
    // HUD 码表
    const kmh=S.v*3.6;
    $('spdNum').textContent=kmh.toFixed(1);
    $('odo').textContent=(S.odo/1000).toFixed(1)+' km';
    const na=(-120+clamp(kmh,0,40)/40*240)*Math.PI/180;
    $('needle').setAttribute('x2',(66+Math.sin(na)*46).toFixed(1));
    $('needle').setAttribute('y2',(70-Math.cos(na)*46).toFixed(1));
  }
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

/* ---- 启动(URL 支持调试参数:?tod=0.3 日落进度 / ?night=1 夜骑 / ?cine=1 兜日 / ?cineT=3.2 兜日起始相位 / ?swoop=1 撒把) ---- */
const qp=new URLSearchParams(location.search);
if(qp.has('tod')){ TOD.t=clamp(+qp.get('tod')||0,0,1); $('tod').value=TOD.t*1000; }
if(qp.has('night')) S.nightBlendTarget=1;
if(qp.has('cine')) setTimeout(()=>{ startCine(true); if(S.cine&&qp.has('cineT')) S.cine.t=+qp.get('cineT')||0; }, 900);   // cineT:确定性命中演出相位(截图/QA 用)
if(qp.has('swoop')) setTimeout(()=>{ setGear(2); setTimeout(trySwoop,200); }, 900);
if(innerWidth<640){ $('gearPanel').classList.add('closed'); $('gearArrow').textContent='▸'; }
updateTodName();
TOD.apply();
window.__PB_OK__=true;
if(window.__pbHideFallback) window.__pbHideFallback();   // 引擎就绪即撤兜底遮罩(慢网下 8s 提示层弹出后,加载成功靠此恢复画面)
tick();

</script>
</body>
</html>
